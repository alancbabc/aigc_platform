<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1260" viewBox="0 0 1900 1260">
  <defs>
    <style>
      .font { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #2f2a24; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #5b5247; }
      .layerTitle { font-size: 25px; font-weight: 700; fill: #332d27; }
      .layerSub { font-size: 15px; font-weight: 600; fill: #6b5f51; }
      .cardTitle { font-size: 17px; font-weight: 700; fill: #2f2a24; }
      .cardText { font-size: 13px; font-weight: 560; fill: #5b5247; }
      .small { font-size: 12px; font-weight: 560; fill: #655b50; }
      .note { font-size: 13px; font-weight: 650; fill: #5d4037; }
      .panel { stroke: #9b8f80; stroke-width: 1.6; rx: 18; }
      .card { fill: #fbfaf6; stroke: #b9ad9f; stroke-width: 1.2; rx: 12; }
      .softCard { fill: #f7f3ec; stroke: #b9ad9f; stroke-width: 1.1; rx: 10; }
      .chip { fill: #f2eadf; stroke: #aa9b8a; stroke-width: 1; rx: 10; }
      .arrow { stroke: #7f5f43; stroke-width: 2.4; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .thinArrow { stroke: #8a8176; stroke-width: 1.8; fill: none; marker-end: url(#thinArrow); stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke: #8a8176; stroke-width: 1.8; fill: none; marker-end: url(#thinArrow); stroke-dasharray: 7 6; stroke-linecap: round; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7f5f43"/>
    </marker>
    <marker id="thinArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,2 L8,5 L2,8 Z" fill="#8a8176"/>
    </marker>
  </defs>

  <rect width="1900" height="1260" fill="#f3f0e8"/>
  <rect x="42" y="38" width="1816" height="1184" rx="24" fill="#faf8f1" stroke="#c1b8aa" stroke-width="1.5"/>

  <text x="78" y="92" class="font title">&#x8F6F;&#x4EF6;&#x67B6;&#x6784;&#x8865;&#x5145;&#x56FE; / Software Architecture View</text>
  <text x="80" y="124" class="font subtitle">Frontend modules, backend orchestration, data persistence, AI adapters and cross-cutting concerns for AIGC Platform.</text>

  <g transform="translate(78,156)">
    <rect width="380" height="38" class="chip"/>
    <text x="18" y="25" class="font note">&#x4E3B;&#x8981;&#x6570;&#x636E;&#x6D41; / Main data flow: Browser -> API -> Orchestrator -> AI Services -> Storage -> UI</text>
  </g>

  <g transform="translate(493,156)">
    <rect width="310" height="38" class="chip"/>
    <text x="18" y="25" class="font note">&#x540C;&#x4E8B;&#x63A5;&#x624B;&#x5173;&#x6CE8; / Handover focus: routes, task lifecycle, storage schema</text>
  </g>

  <g transform="translate(835,156)">
    <rect width="392" height="38" class="chip"/>
    <text x="18" y="25" class="font note">&#x98CE;&#x683C; / Style: neutral, modular, research-diagram oriented</text>
  </g>

  <!-- Frontend layer -->
  <g transform="translate(70,230)">
    <rect class="panel" width="420" height="750" fill="#ebe6dc"/>
    <text x="26" y="45" class="font layerTitle">&#x524D;&#x7AEF;&#x5C42; / Frontend Layer</text>
    <text x="28" y="72" class="font layerSub">React 18 + Vite + Router + Context + Tailwind</text>

    <rect class="card" x="24" y="104" width="372" height="112"/>
    <text x="42" y="135" class="font cardTitle">&#x9875;&#x9762;&#x4E0E;&#x8DEF;&#x7531; / Pages and Routes</text>
    <text x="42" y="162" class="font cardText">Login, Register, Dashboard routes</text>
    <text x="42" y="184" class="font cardText">ProtectedRoute gates /dashboard/*</text>
    <text x="42" y="206" class="font small">App.jsx, DashboardPage, AuthLayout, DashboardLayout</text>

    <rect class="card" x="24" y="240" width="372" height="142"/>
    <text x="42" y="271" class="font cardTitle">&#x5DE5;&#x4F5C;&#x5BA4; / Creative Studios</text>
    <text x="42" y="298" class="font cardText">ImageStudio: text2image, image edit</text>
    <text x="42" y="320" class="font cardText">VideoStudio: text2video, image2video, audio2video</text>
    <text x="42" y="342" class="font cardText">AudioStudio: TTS, voice clone</text>
    <text x="42" y="364" class="font cardText">InterpolationStudio: keyframe video</text>

    <rect class="card" x="24" y="406" width="372" height="124"/>
    <text x="42" y="437" class="font cardTitle">&#x72B6;&#x6001;&#x7BA1;&#x7406; / State Management</text>
    <text x="42" y="464" class="font cardText">AuthContext: token, session validation, logout</text>
    <text x="42" y="486" class="font cardText">TaskContext: polling, task recovery, history refresh</text>
    <text x="42" y="508" class="font small">sessionStorage: aigc_auth, aigc_tasks</text>

    <rect class="card" x="24" y="554" width="372" height="116"/>
    <text x="42" y="585" class="font cardTitle">&#x901A;&#x7528;&#x7EC4;&#x4EF6; / Shared UI Components</text>
    <text x="42" y="612" class="font cardText">PromptInput, UploadButton, ResultDisplay</text>
    <text x="42" y="634" class="font cardText">PromptPanel, RightPanel, TaskTab, HistoryTab</text>
    <text x="42" y="656" class="font small">Toast, Modal, model dropdowns, history cards</text>

    <rect class="card" x="24" y="694" width="372" height="36"/>
    <text x="42" y="718" class="font cardText">src/api/client.js: REST wrapper, retry, ETag cache, media URL token</text>
  </g>

  <!-- Backend API layer -->
  <g transform="translate(548,230)">
    <rect class="panel" width="430" height="750" fill="#ede8dd"/>
    <text x="26" y="45" class="font layerTitle">&#x540E;&#x7AEF;&#x5C42; / Backend API Layer</text>
    <text x="28" y="72" class="font layerSub">Express 4 + JWT + Axios + FormData</text>

    <rect class="card" x="24" y="104" width="382" height="124"/>
    <text x="42" y="135" class="font cardTitle">server/index.js / API Gateway</text>
    <text x="42" y="162" class="font cardText">CORS, logger, JSON 50MB, production static dist</text>
    <text x="42" y="184" class="font cardText">Protected /outputs/:user media serving</text>
    <text x="42" y="206" class="font small">Routes: /api/auth, /api/generate, /api/history</text>

    <rect class="card" x="24" y="252" width="382" height="118"/>
    <text x="42" y="283" class="font cardTitle">&#x63A5;&#x53E3;&#x8DEF;&#x7531; / Route Modules</text>
    <text x="42" y="310" class="font cardText">auth.js: register, login, rate limit</text>
    <text x="42" y="332" class="font cardText">generate.js: image, video, interpolation, audio</text>
    <text x="42" y="354" class="font cardText">history.js: cursor list, ETag, delete</text>

    <rect class="card" x="24" y="394" width="382" height="150"/>
    <text x="42" y="425" class="font cardTitle">&#x6838;&#x5FC3;&#x7F16;&#x6392; / Generation Orchestrator</text>
    <text x="42" y="452" class="font cardText">Validate prompt, uploads, duration, dimensions</text>
    <text x="42" y="474" class="font cardText">Resolve model pipeline and build multipart payload</text>
    <text x="42" y="496" class="font cardText">submitTask -> pollTask -> downloadTask -> addHistory</text>
    <text x="42" y="518" class="font small">activeTasks Map + taskStore JSON recovery</text>

    <rect class="card" x="24" y="568" width="382" height="124"/>
    <text x="42" y="599" class="font cardTitle">&#x4E2D;&#x95F4;&#x4EF6;&#x4E0E;&#x5B89;&#x5168; / Middleware and Security</text>
    <text x="42" y="626" class="font cardText">authMiddleware: Bearer token or media query token</text>
    <text x="42" y="648" class="font cardText">logger, route-level rate limits, upload validation</text>
    <text x="42" y="670" class="font small">JWT_SECRET mandatory, user output isolation</text>
  </g>

  <!-- Services and utilities -->
  <g transform="translate(1036,230)">
    <rect class="panel" width="390" height="750" fill="#eee9df"/>
    <text x="26" y="45" class="font layerTitle">&#x670D;&#x52A1;&#x4E0E;&#x5DE5;&#x5177; / Services and Utilities</text>
    <text x="28" y="72" class="font layerSub">Domain services, adapters and reusable backend helpers</text>

    <rect class="card" x="24" y="104" width="342" height="118"/>
    <text x="42" y="135" class="font cardTitle">&#x7528;&#x6237;&#x4E0E;&#x8BA4;&#x8BC1; / User and Auth</text>
    <text x="42" y="162" class="font cardText">userStore.js: users.json CRUD</text>
    <text x="42" y="184" class="font cardText">crypto.js: bcrypt hash and compare</text>
    <text x="42" y="206" class="font small">token.js: sign and verify JWT</text>

    <rect class="card" x="24" y="246" width="342" height="140"/>
    <text x="42" y="277" class="font cardTitle">&#x6301;&#x4E45;&#x5316; / Persistence Services</text>
    <text x="42" y="304" class="font cardText">historyStore.js: add, list, delete history</text>
    <text x="42" y="326" class="font cardText">taskStore.js: generation snapshots</text>
    <text x="42" y="348" class="font cardText">fileStore.js: locks, atomic JSON write, backups</text>
    <text x="42" y="370" class="font small">Best for single-node deployments</text>

    <rect class="card" x="24" y="410" width="342" height="140"/>
    <text x="42" y="441" class="font cardTitle">&#x6A21;&#x578B;&#x9002;&#x914D; / Model Adapters</text>
    <text x="42" y="468" class="font cardText">resolution.js: presets and aspect ratio to pixels</text>
    <text x="42" y="490" class="font cardText">translate.js: CJK video prompt translation</text>
    <text x="42" y="512" class="font cardText">promptOptimizer.js: skill-guided LLM optimization</text>
    <text x="42" y="534" class="font small">IMAGE_SKILL.md, LTX_SKILL.md</text>

    <rect class="card" x="24" y="574" width="342" height="108"/>
    <text x="42" y="605" class="font cardTitle">&#x914D;&#x7F6E;&#x4E0E;&#x8FD0;&#x7EF4; / Config and Operations</text>
    <text x="42" y="632" class="font cardText">server/config.js: AI URLs, JWT, timeouts</text>
    <text x="42" y="654" class="font cardText">VIDEO_POLL_TOTAL_TIMEOUT_MS for long queues</text>
  </g>

  <!-- Data and AI layer -->
  <g transform="translate(1484,230)">
    <rect class="panel" width="346" height="750" fill="#e9e6de"/>
    <text x="26" y="45" class="font layerTitle">&#x6570;&#x636E;&#x4E0E; AI / Data &amp; AI</text>
    <text x="28" y="72" class="font layerSub">Runtime files and self-hosted model services</text>

    <rect class="card" x="24" y="104" width="298" height="154"/>
    <text x="42" y="135" class="font cardTitle">&#x6570;&#x636E;&#x5C42; / File Data Store</text>
    <text x="42" y="162" class="font cardText">server/data/users.json</text>
    <text x="42" y="184" class="font cardText">history/{username}.json</text>
    <text x="42" y="206" class="font cardText">tasks/{username}/{generationId}.json</text>
    <text x="42" y="228" class="font cardText">outputs/{username}/ PNG, MP4, WAV</text>

    <rect class="card" x="24" y="286" width="298" height="178"/>
    <text x="42" y="317" class="font cardTitle">&#x6A21;&#x578B;&#x670D;&#x52A1;&#x5C42; / AI Services</text>
    <text x="42" y="344" class="font cardText">Qwen Image :9000</text>
    <text x="42" y="366" class="font cardText">LTX 2.3 Video :8000</text>
    <text x="42" y="388" class="font cardText">Qwen3 TTS :9200</text>
    <text x="42" y="410" class="font cardText">IndexTTS 2 :9300</text>
    <text x="42" y="432" class="font cardText">Gitee LLM API</text>

    <rect class="card" x="24" y="492" width="298" height="122"/>
    <text x="42" y="523" class="font cardTitle">&#x7EDF;&#x4E00;&#x534F;&#x8BAE; / Unified AI Protocol</text>
    <text x="42" y="550" class="font cardText">POST /submit -> task_id</text>
    <text x="42" y="572" class="font cardText">GET /status/{taskId}</text>
    <text x="42" y="594" class="font cardText">GET /download/{taskId}</text>

    <rect class="card" x="24" y="642" width="298" height="58"/>
    <text x="42" y="675" class="font cardText">Pipelines: qwen_image, ti2v, a2vid, index_tts</text>
  </g>

  <!-- Cross-layer arrows -->
  <path class="arrow" d="M490 600 C515 600, 523 600, 548 600"/>
  <text x="505" y="578" class="font small">REST JSON</text>

  <path class="arrow" d="M978 600 C1000 600, 1014 600, 1036 600"/>
  <text x="990" y="578" class="font small">service calls</text>

  <path class="arrow" d="M1426 520 C1450 520, 1460 520, 1484 520"/>
  <text x="1438" y="498" class="font small">data / AI adapters</text>

  <path class="dash" d="M1695 614 C1695 705, 1595 805, 1426 860"/>
  <text x="1572" y="742" class="font small">binary results</text>

  <path class="dash" d="M1484 360 C1345 335, 1240 338, 1168 410"/>
  <text x="1270" y="326" class="font small">skill docs / config</text>

  <path class="dash" d="M1540 285 C1398 180, 812 180, 260 230"/>
  <text x="772" y="212" class="font small">media URLs and history refresh</text>

  <!-- Cross-cutting band -->
  <g transform="translate(118,1030)">
    <rect class="panel" width="1664" height="118" fill="#e7e1d6"/>
    <text x="26" y="38" class="font layerTitle" style="font-size:22px;">&#x6A2A;&#x5207;&#x5173;&#x6CE8;&#x70B9; / Cross-cutting Concerns</text>
    <g transform="translate(26,58)">
      <rect class="softCard" width="248" height="40"/>
      <text x="16" y="26" class="font cardText">JWT Auth + protected outputs</text>
    </g>
    <g transform="translate(296,58)">
      <rect class="softCard" width="258" height="40"/>
      <text x="16" y="26" class="font cardText">Generation idempotency + recovery</text>
    </g>
    <g transform="translate(576,58)">
      <rect class="softCard" width="242" height="40"/>
      <text x="16" y="26" class="font cardText">Polling timeout and retry policy</text>
    </g>
    <g transform="translate(840,58)">
      <rect class="softCard" width="222" height="40"/>
      <text x="16" y="26" class="font cardText">Prompt optimize / translation</text>
    </g>
    <g transform="translate(1084,58)">
      <rect class="softCard" width="238" height="40"/>
      <text x="16" y="26" class="font cardText">Atomic JSON writes and locks</text>
    </g>
    <g transform="translate(1344,58)">
      <rect class="softCard" width="270" height="40"/>
      <text x="16" y="26" class="font cardText">User file isolation and path safety</text>
    </g>
  </g>

  <text x="78" y="1194" class="font small">Supplemental diagram for onboarding: software modules and responsibility boundaries, not a deployment topology.</text>
</svg>
