<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.55" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.58" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f2"/>
      <stop offset="1" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fefce8"/>
      <stop offset="1" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7c2d12" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#7c2d12" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <path d="M2,2 L14,8 L2,14 Z" fill="#ea580c"/>
    </marker>
    <marker id="softArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#b45309"/>
    </marker>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 50px; font-weight: 800; fill: #431407; letter-spacing: 0.5px; }
      .subtitle { font-size: 22px; font-weight: 600; fill: #78350f; }
      .section { font-size: 30px; font-weight: 800; fill: #7c2d12; }
      .sectionSub { font-size: 17px; font-weight: 700; fill: #92400e; }
      .cardTitle { font-size: 21px; font-weight: 800; fill: #431407; }
      .cardText { font-size: 16px; font-weight: 650; fill: #78350f; }
      .small { font-size: 14px; font-weight: 650; fill: #92400e; }
      .pillText { font-size: 14px; font-weight: 800; fill: #7c2d12; }
      .panel { stroke: #fdba74; stroke-width: 2; rx: 30; filter: url(#shadow); }
      .card { fill: #fffaf0; stroke: #fed7aa; stroke-width: 2; rx: 18; filter: url(#cardShadow); }
      .mini { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; rx: 14; }
      .badge { fill: #ffedd5; stroke: #fb923c; stroke-width: 1.4; rx: 14; }
      .line { stroke: #ea580c; stroke-width: 4; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke: #b45309; stroke-width: 3; fill: none; marker-end: url(#softArrow); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>
  <circle cx="1585" cy="135" r="190" fill="#fed7aa" opacity="0.24"/>
  <circle cx="265" cy="965" r="230" fill="#fde68a" opacity="0.28"/>
  <circle cx="1550" cy="945" r="150" fill="#fecaca" opacity="0.22"/>

  <rect x="70" y="56" width="1660" height="118" rx="34" fill="url(#top)" filter="url(#shadow)"/>
  <text x="110" y="116" class="font title">AIGC Platform Architecture</text>
  <text x="112" y="153" class="font subtitle">React Workbench - Express API Gateway - Self-hosted AI Services - JSON and Media Storage</text>

  <g transform="translate(108,212)">
    <rect width="362" height="58" rx="29" fill="#fffaf0" stroke="#fdba74" stroke-width="2"/>
    <circle cx="33" cy="29" r="13" fill="#f97316"/>
    <text x="58" y="36" class="font pillText">User Flow: login, create, preview, download</text>
  </g>

  <g transform="translate(540,212)">
    <rect width="330" height="58" rx="29" fill="#fffaf0" stroke="#fdba74" stroke-width="2"/>
    <circle cx="33" cy="29" r="13" fill="#f59e0b"/>
    <text x="58" y="36" class="font pillText">Core Flow: submit, poll, download, archive</text>
  </g>

  <g transform="translate(940,212)">
    <rect width="395" height="58" rx="29" fill="#fffaf0" stroke="#fdba74" stroke-width="2"/>
    <circle cx="33" cy="29" r="13" fill="#fb7185"/>
    <text x="58" y="36" class="font pillText">AI Features: image, video, audio, prompt optimization</text>
  </g>

  <g transform="translate(1405,212)">
    <rect width="290" height="58" rx="29" fill="#fffaf0" stroke="#fdba74" stroke-width="2"/>
    <circle cx="33" cy="29" r="13" fill="#d97706"/>
    <text x="58" y="36" class="font pillText">Storage: users, tasks, history, outputs</text>
  </g>

  <g transform="translate(80,320)">
    <rect class="panel" width="430" height="600" fill="url(#front)"/>
    <text x="34" y="52" class="font section">Frontend Layer</text>
    <text x="36" y="82" class="font sectionSub">React 18 - Vite 3002 - Router - Context - Tailwind</text>

    <rect class="card" x="32" y="120" width="366" height="86"/>
    <text x="56" y="154" class="font cardTitle">Creative Studios</text>
    <text x="56" y="181" class="font cardText">Image, Video, Audio, Voice Clone, Interpolation</text>

    <rect class="card" x="32" y="230" width="366" height="104"/>
    <text x="56" y="264" class="font cardTitle">Input and Parameters</text>
    <text x="56" y="291" class="font cardText">Prompt, resolution, aspect ratio, quality, seed</text>
    <text x="56" y="316" class="font cardText">Reference images, keyframes, audio uploads</text>

    <rect class="card" x="32" y="358" width="366" height="104"/>
    <text x="56" y="392" class="font cardTitle">State Management</text>
    <text x="56" y="419" class="font cardText">AuthContext: login session and token</text>
    <text x="56" y="444" class="font cardText">TaskContext: polling and refresh recovery</text>

    <rect class="card" x="32" y="486" width="366" height="80"/>
    <text x="56" y="520" class="font cardTitle">API Client</text>
    <text x="56" y="547" class="font cardText">Fetch wrapper, 401 handling, media token URL</text>
  </g>

  <g transform="translate(610,320)">
    <rect class="panel" width="570" height="600" fill="url(#back)"/>
    <text x="34" y="52" class="font section">Backend Layer</text>
    <text x="36" y="82" class="font sectionSub">Express API 3001 - JWT - AI async orchestration</text>

    <rect class="card" x="34" y="118" width="230" height="104"/>
    <text x="58" y="152" class="font cardTitle">Auth Routes</text>
    <text x="58" y="179" class="font cardText">Register and login</text>
    <text x="58" y="204" class="font cardText">Rate limit, bcrypt, JWT</text>

    <rect class="card" x="306" y="118" width="230" height="104"/>
    <text x="330" y="152" class="font cardTitle">History Routes</text>
    <text x="330" y="179" class="font cardText">Pagination and ETag</text>
    <text x="330" y="204" class="font cardText">Delete records and files</text>

    <rect class="card" x="34" y="250" width="502" height="150"/>
    <text x="58" y="284" class="font cardTitle">Generate Routes</text>
    <text x="58" y="314" class="font cardText">Validate params, resolve dimensions, choose pipeline</text>
    <text x="58" y="341" class="font cardText">Submit AI task, poll status, download output</text>
    <text x="58" y="368" class="font cardText">generationId, activeTasks, taskStore recovery</text>

    <g transform="translate(34,426)">
      <rect class="mini" width="150" height="72"/>
      <text x="22" y="31" class="font cardText">Prompt</text>
      <text x="22" y="54" class="font small">Optimize via LLM</text>
    </g>
    <g transform="translate(210,426)">
      <rect class="mini" width="150" height="72"/>
      <text x="22" y="31" class="font cardText">Translate</text>
      <text x="22" y="54" class="font small">Video prompts</text>
    </g>
    <g transform="translate(386,426)">
      <rect class="mini" width="150" height="72"/>
      <text x="22" y="31" class="font cardText">Outputs</text>
      <text x="22" y="54" class="font small">Protected files</text>
    </g>

    <rect class="card" x="34" y="526" width="502" height="44"/>
    <text x="58" y="554" class="font cardText">Config: AI URLs, poll timeout, video timeout, download retry</text>
  </g>

  <g transform="translate(1280,320)">
    <rect class="panel" width="440" height="600" fill="url(#ai)"/>
    <text x="34" y="52" class="font section">AI Services Layer</text>
    <text x="36" y="82" class="font sectionSub">Unified protocol: submit, status, download</text>

    <rect class="card" x="32" y="120" width="376" height="76"/>
    <text x="56" y="151" class="font cardTitle">Qwen Image :9000</text>
    <text x="56" y="177" class="font cardText">qwen_image, qwen_image_edit</text>

    <rect class="card" x="32" y="218" width="376" height="104"/>
    <text x="56" y="249" class="font cardTitle">LTX 2.3 Video :8000</text>
    <text x="56" y="275" class="font cardText">ti2v_two_stage, ti2vid_two_stages_hq</text>
    <text x="56" y="300" class="font cardText">a2vid_two_stage, keyframe interpolation</text>

    <rect class="card" x="32" y="344" width="376" height="82"/>
    <text x="56" y="375" class="font cardTitle">Qwen3 TTS :9200</text>
    <text x="56" y="401" class="font cardText">Custom voice and voice design</text>

    <rect class="card" x="32" y="448" width="376" height="82"/>
    <text x="56" y="479" class="font cardTitle">IndexTTS 2 :9300</text>
    <text x="56" y="505" class="font cardText">Voice clone with emotion control</text>

    <rect class="card" x="32" y="552" width="376" height="36"/>
    <text x="56" y="576" class="font cardText">Gitee LLM: prompt optimize and translation</text>
  </g>

  <g transform="translate(280,980)">
    <rect width="1240" height="92" rx="28" fill="url(#data)" stroke="#facc15" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="34" y="40" class="font section" style="font-size:24px;">Data and File Storage</text>
    <text x="34" y="70" class="font cardText">users.json - history per user - task snapshots - output media files in PNG, MP4 and WAV</text>
  </g>

  <path class="line" d="M510 620 C548 620, 570 620, 610 620"/>
  <text x="528" y="596" class="font pillText">REST JSON</text>

  <path class="line" d="M1180 620 C1220 620, 1240 620, 1280 620"/>
  <text x="1197" y="596" class="font pillText">FormData AI Task</text>

  <path class="dash" d="M900 920 C900 950, 900 960, 900 980"/>
  <text x="918" y="955" class="font pillText">Persist tasks, history, outputs</text>

  <path class="dash" d="M1480 920 C1480 948, 1465 958, 1430 980"/>
  <text x="1342" y="954" class="font pillText">Download result stream</text>

  <path class="dash" d="M435 980 C390 952, 360 940, 315 920"/>
  <text x="250" y="954" class="font pillText">Read history and media</text>

  <g transform="translate(565,254)">
    <rect width="670" height="48" rx="24" fill="#fffaf0" stroke="#fb923c" stroke-width="2"/>
    <text x="38" y="31" class="font pillText">Core Chain</text>
    <text x="130" y="31" class="font cardText">Submit</text>
    <path d="M195 24 L240 24" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="265" y="31" class="font cardText">Poll</text>
    <path d="M310 24 L355 24" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="380" y="31" class="font cardText">Download</text>
    <path d="M475 24 L520 24" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="545" y="31" class="font cardText">Archive</text>
  </g>

  <g transform="translate(84,940)">
    <rect class="badge" width="170" height="34"/>
    <text x="18" y="23" class="font pillText">Single-node storage</text>
  </g>
  <g transform="translate(1518,940)">
    <rect class="badge" width="198" height="34"/>
    <text x="18" y="23" class="font pillText">AI services deploy separately</text>
  </g>
</svg>
